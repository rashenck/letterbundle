services:
  postgres:
    image: postgres:16
    container_name: letterbundle-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: letterbundle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: letterbundle-localstack
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - GATEWAY_LISTEN=0.0.0.0:4566
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: letterbundle-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: letterbundle-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/letterbundle
      - SECRET_KEY=change-me-in-production-use-a-long-random-string
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=letterbundle-images
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: letterbundle-backend-tests
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/letterbundle
      - SECRET_KEY=change-me-in-production-use-a-long-random-string
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=letterbundle-images
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    entrypoint: ["sh", "-c", "pytest \"$@\"", "--"]
  
volumes:
  postgres_data:
  localstack_data:
