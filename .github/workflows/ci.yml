name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      UV_VENV: backend/.venv
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev --frozen --project backend

      - name: Debug
        run: |
          uv run python -m pip list
          uv run which pytest
        working-directory: backend

      - name: Run tests
        working-directory: backend
        run: uv run --project backend pytest -x -v

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Run mypy
        working-directory: backend
        run: uv run mypy .
