name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      UV_VENV: backend/.venv
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen --project backend

      - name: Debug
        run: |
          pwd
          ls -la
          cat pyproject.toml

      - name: Run tests
        run: uv run pytest -x -v

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .
