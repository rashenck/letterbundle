# Development compose file - use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# This enables hot-reload and better development experience

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: letterbundle-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      # Mount only source code for hot reload to avoid conflicts with Next.js generated files
      - ./frontend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
